<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATU University Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 15px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .social-buttons i {
            font-size: 20px;
            margin: 0 10px;
            cursor: pointer;
        }
        .header {
            font-size: 2em;
            margin-bottom: 20px;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="login-container text-center">
        <h1 class="header">Hello, Welcome!</h1>
        <p>Don't have an account? <a href="#" class="btn btn-link">Register</a></p>

        <form>
            <div class="form-group">
                <input type="text" class="form-control" placeholder="Username" aria-label="Username">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" placeholder="Password" aria-label="Password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <p class="mt-3"><a href="#">Forgot Password?</a></p>
        </form>

        <div class="social-buttons mt-4">
            <p>or login with social platforms</p>
            <i class="fab fa-google text-danger"></i>
            <i class="fab fa-facebook text-primary"></i>
            <i class="fab fa-github text-dark"></i>
            <i class="fab fa-linkedin text-info"></i>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
