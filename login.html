<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT University - Login System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #3498db, #8e44ad);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Replace the fixed container width */
      .container {
        background-color: white;
        width: 90%; /* Use percentage instead of fixed width */
        max-width: 400px; /* Maximum width on larger screens */
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      /* Add these media queries at the end of your CSS */
      @media screen and (max-width: 480px) {
        .container {
          width: 95%;
          border-radius: 8px;
        }

        .tabs {
          flex-direction: column;
        }

        .tab {
          padding: 12px 5px;
          font-size: 0.9rem;
        }

        .form-container {
          padding: 15px;
        }

        h1 {
          font-size: 1.3rem;
        }

        .input-group input {
          padding: 10px;
        }

        button {
          padding: 10px;
        }

        .university-logo h2 {
          font-size: 24px;
        }
      }

      /* For very small screens */
      @media screen and (max-width: 320px) {
        .form-container {
          padding: 10px;
        }

        .input-group {
          margin-bottom: 15px;
        }

        h1 {
          font-size: 1.1rem;
          margin-bottom: 15px;
        }
      }
      @media screen and (max-width: 480px) {
        /* Additional rules for better touch interaction */
        .input-group input {
          height: 44px; /* Minimum touch target size */
        }

        button {
          height: 44px;
          margin-top: 5px;
        }
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid #eee;
      }

      .tab {
        flex: 1;
        text-align: center;
        padding: 15px;
        cursor: pointer;
        background-color: #f8f8f8;
        transition: all 0.3s;
      }

      .tab:first-child {
        border-top-left-radius: 10px;
      }

      .tab:last-child {
        border-top-right-radius: 10px;
      }

      .tab.active {
        background-color: white;
        font-weight: bold;
      }

      .form-container {
        padding: 30px;
      }

      .form {
        display: none;
      }

      .form.active {
        display: block;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
        font-size: 24px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #555;
      }

      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        outline: none;
        transition: border 0.3s;
      }

      .input-group input:focus {
        border-color: #3498db;
      }

      button {
        width: 100%;
        background-color: #3498db;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #2980b9;
      }

      .form-footer {
        text-align: center;
        margin-top: 20px;
      }

      .form-footer a {
        color: #3498db;
        text-decoration: none;
      }

      .form-footer a:hover {
        text-decoration: underline;
      }

      .university-logo {
        text-align: center;
        margin-bottom: 20px;
      }

      .university-logo h2 {
        color: #3498db;
        font-size: 30px;
        letter-spacing: 1px;
      }

      .university-logo span {
        color: #8e44ad;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tabs">
        <div class="tab active" data-form="login">Login</div>
        <div class="tab" data-form="register">Register</div>
        <div class="tab" data-form="forgot">Reset</div>
      </div>

      <div class="form-container">
        <div class="university-logo">
          <h2>IT<span>University</span></h2>
        </div>

        <!-- Login Form -->
        <div class="form active" id="login">
          <h1>Sign In to Your Account</h1>
          <form>
            <div class="input-group">
              <label for="login-email">Student ID / Email</label>
              <input
                type="text"
                id="login-email"
                placeholder="Enter your student ID or email"
                required
              />
            </div>
            <div class="input-group">
              <label for="login-password">Password</label>
              <input
                type="password"
                id="login-password"
                placeholder="Enter your password"
                required
              />
            </div>
            <button type="submit">Login</button>
            <div class="form-footer">
              <p>
                Don't have an account?
                <a href="#" class="form-link" data-form="register">Register</a>
              </p>
              <p>
                Forgot password?
                <a href="#" class="form-link" data-form="forgot">Reset it</a>
              </p>
            </div>
          </form>
        </div>

        <!-- Register Form -->
        <div class="form" id="register">
          <h1>Create New Account</h1>
          <form>
            <div class="input-group">
              <label for="register-name">Full Name</label>
              <input
                type="text"
                id="register-name"
                placeholder="Enter your full name"
                required
              />
            </div>
            <div class="input-group">
              <label for="register-email">Email Address</label>
              <input
                type="email"
                id="register-email"
                placeholder="Enter your email address"
                required
              />
            </div>
            <div class="input-group">
              <label for="register-student-id"
                >Student ID (if applicable)</label
              >
              <input
                type="text"
                id="register-student-id"
                placeholder="Enter your student ID"
              />
            </div>
            <div class="input-group">
              <label for="register-password">Password</label>
              <input
                type="password"
                id="register-password"
                placeholder="Create a password"
                required
              />
            </div>
            <div class="input-group">
              <label for="register-confirm-password">Confirm Password</label>
              <input
                type="password"
                id="register-confirm-password"
                placeholder="Confirm your password"
                required
              />
            </div>
            <button type="submit">Register</button>
            <div class="form-footer">
              <p>
                Already have an account?
                <a href="#" class="form-link" data-form="login">Login</a>
              </p>
            </div>
          </form>
        </div>

        <!-- Forgot Password Form -->
        <div class="form" id="forgot">
          <h1>Reset Your Password</h1>
          <form>
            <div class="input-group">
              <label for="forgot-email">Email Address / Student ID</label>
              <input
                type="text"
                id="forgot-email"
                placeholder="Enter your registered email or ID"
                required
              />
            </div>
            <button type="submit">Send Reset Link</button>
            <div class="form-footer">
              <p>
                Remember your password?
                <a href="#" class="form-link" data-form="login">Login</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Tab switching functionality
      const tabs = document.querySelectorAll(".tab");
      const forms = document.querySelectorAll(".form");
      const formLinks = document.querySelectorAll(".form-link");

      function activateTab(tabName) {
        // Deactivate all tabs and forms
        tabs.forEach((tab) => tab.classList.remove("active"));
        forms.forEach((form) => form.classList.remove("active"));

        // Activate the selected tab and form
        document
          .querySelector(`.tab[data-form="${tabName}"]`)
          .classList.add("active");
        document.getElementById(tabName).classList.add("active");
      }

      // Event listeners for tabs
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          activateTab(tab.getAttribute("data-form"));
        });
      });

      // Event listeners for in-form links
      formLinks.forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          activateTab(link.getAttribute("data-form"));
        });
      });

      // Form submission (placeholder)
      document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          alert(
            "This is a frontend demo. Connect to your backend to implement actual functionality."
          );
        });
      });
    </script>
  </body>
</html>
